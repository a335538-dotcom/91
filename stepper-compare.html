<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>衡好選 / E-2 vs G-2 Stepper 比較</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --stage: #E4EAE8;
  --bg: #f2f7f6;
  --card: #ffffff;
  --brand: #1bbf9c;
  --brand-txt: #15967b;
  --brand-dark: #0f6f5b;
  --ink: #191a19;
  --txt: #333333;
  --txt2: #424242;
  --txt3: #6b6b6b;
  --txt4: #474847;
  --muted: #575757;
  --hint: #737373;
  --line: #dbdbdb;
  --field-line: #ebebeb;
  --control: #adadad;
  --placeholder: #adadad;
  --required: #eb3d37;
  --bar: #191a19;
  --shadow: 0 4px 20px rgba(0,151,119,0.15);
  --body: 'Noto Sans TC', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--stage);
  color: var(--txt);
  font-family: var(--body);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--brand-dark); outline-offset: 2px; }

/* ── PROTOTYPE TOOLBAR ── */
.toolbar {
  flex: 0 0 auto;
  min-height: 64px;
  padding: 12px 24px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 24px;
  background: var(--bar);
  color: #ffffff;
}
.toolbar-title { font-size: 15px; font-weight: 700; }
.toggle { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  height: 36px;
  padding: 0 16px;
  border-radius: 18px;
  border: 1px solid #737373;
  background: transparent;
  color: #ffffff;
  font-size: 14px;
}
.chip.on { border-color: var(--brand); background: var(--brand); color: var(--ink); font-weight: 700; }
.toolbar-note { margin-left: auto; font-size: 13px; color: #dbdbdb; }

/* ── STAGE ── */
.stage { flex: 1 1 auto; display: flex; }
.stage.mobile { justify-content: center; align-items: center; padding: 24px 0; }

.screen { background: var(--bg); display: flex; flex-direction: column; flex: 1 1 auto; position: relative; }
.stage.mobile .screen { flex: 0 0 auto; width: 390px; height: 844px; border-radius: 24px; overflow: hidden; }

/* ── HEADER ── */
.header {
  height: 64px;
  flex: 0 0 auto;
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 32px; height: 32px; border-radius: 50%; background: var(--brand); }
.brand-name { font-size: 17px; font-weight: 700; color: var(--ink); }
.brand-en { font-size: 10px; color: var(--txt4); }
.location { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 500; }

.mobile .header { height: 52px; padding: 0 16px; }
.mobile .brand { gap: 8px; }
.mobile .brand-mark { width: 26px; height: 26px; }
.mobile .brand-name { font-size: 15px; }
.mobile .brand-en { display: none; }
.mobile .location { font-size: 13px; gap: 3px; }

/* ── E-2 STEPPER ── */
.e-steps { flex: 0 0 auto; display: flex; justify-content: center; gap: 20px; padding-top: 4px; list-style: none; }
.e-step { display: flex; align-items: flex-start; gap: 20px; }
.e-step-body { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.label { font-size: 15px; color: var(--txt3); }
.current .label { font-weight: 700; color: var(--ink); }
.dots { display: flex; gap: 6px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.dot.on { background: var(--brand); }

.e-mobile { flex: 0 0 auto; height: 36px; padding: 0 16px; display: flex; align-items: center; gap: 12px; }
.e-mobile .dots { gap: 5px; }
.m-name { font-size: 15px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.m-name.login { font-size: 14px; font-weight: 500; color: var(--txt4); }

/* ── G-2 RAIL ── */
.body-row { flex: 1 1 auto; min-height: 0; display: flex; }
.mobile .body-row { overflow-y: auto; }
.rail { width: 264px; flex: 0 0 auto; padding: 24px 0 0 40px; }
.rail-spacer { width: 264px; flex: 0 0 auto; }
.rail-list { list-style: none; display: flex; flex-direction: column; }
.rail-item {
  border-left: 2px solid var(--line);
  padding: 12px 0 12px 16px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.rail-item:first-child { padding-top: 0; }
.rail-item.current { border-left-color: var(--brand); }
.rail-count { font-size: 12px; color: var(--muted); }
.rail-note { border-left: 2px solid var(--line); padding: 0 0 8px 16px; font-size: 13px; color: var(--txt4); }

.g-mobile { flex: 0 0 auto; height: 36px; padding: 0 16px; display: flex; align-items: center; position: relative; z-index: 2; }
.g-toggle {
  height: 44px;
  margin: -4px 0;
  border: 0;
  background: none;
  display: flex;
  align-items: center;
  gap: 8px;
  text-align: left;
}
.g-toggle .count { font-size: 13px; color: var(--muted); white-space: nowrap; }
.g-toggle svg { flex: 0 0 auto; transition: transform 0.15s; }
.g-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
.g-sheet {
  position: absolute;
  left: 16px; right: 16px; top: 40px;
  background: var(--card);
  border-radius: 20px;
  box-shadow: 0 8px 28px rgba(25,26,25,0.16);
  padding: 16px 20px 8px;
}

/* ── PAGE ── */
.page {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 0 40px;
  gap: 4px;
}
.page-title { font-size: 24px; font-weight: 700; color: var(--txt); letter-spacing: 0.4px; text-align: center; }
.page-sub { font-size: 18px; color: var(--txt2); text-align: center; }
.page-card {
  width: 800px;
  max-width: 100%;
  margin-top: 20px;
  background: var(--card);
  border-radius: 32px;
  box-shadow: var(--shadow);
}
.page-card.placeholder {
  height: 360px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  font-size: 15px;
  color: var(--hint);
}
.mobile .page { padding: 16px 16px 24px; gap: 6px; }
.mobile .page-title { font-size: 20px; letter-spacing: 0; }
.mobile .page-sub { font-size: 15px; }
.mobile .page-card { width: 100%; border-radius: 24px; }

.loading { display: flex; flex-direction: column; align-items: center; gap: 16px; color: var(--muted); }
.spinner {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 4px solid #e8e8e8;
  border-top-color: var(--brand);
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── FORM CARD ── */
.form { padding: 32px 0; display: flex; flex-direction: column; gap: 16px; }
.section-head { position: relative; padding: 0 60px 0 56px; display: flex; flex-direction: column; gap: 2px; }
.section-head::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  width: 4px; height: 40px;
  margin-top: -20px;
  background: var(--brand);
}
.eyebrow { font-size: 14px; font-weight: 500; color: var(--brand-txt); }
.section-title { font-size: 18px; font-weight: 700; color: var(--txt); letter-spacing: 0.4px; line-height: 1.3; }
.req { color: var(--required); font-size: 14px; font-weight: 500; margin-left: 4px; }
.section-desc { font-size: 14px; color: var(--hint); line-height: 1.4; }

.options { padding: 0 56px; display: flex; flex-direction: column; gap: 32px; }
.none-row { padding-bottom: 24px; border-bottom: 1px solid var(--line); }
.group { display: flex; flex-direction: column; gap: 8px; }
.group-label { font-size: 16px; font-weight: 500; color: var(--txt); }
.choices { display: flex; flex-wrap: wrap; gap: 16px 24px; padding: 8px 0; }

.opt { display: inline-flex; align-items: center; gap: 8px; min-height: 24px; font-size: 14px; color: var(--txt); cursor: pointer; }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.box {
  width: 24px; height: 24px;
  flex: 0 0 auto;
  border: 1px solid var(--control);
  border-radius: 8px;
  background: var(--card);
  display: flex;
  align-items: center;
  justify-content: center;
}
.radio .box { border-radius: 50%; }
.opt input:checked + .box { background: var(--brand); border-color: var(--brand); }
.opt input:checked + .box::after {
  content: '';
  width: 10px; height: 6px;
  border-left: 2px solid #ffffff;
  border-bottom: 2px solid #ffffff;
  transform: translateY(-1px) rotate(-45deg);
}
.radio input:checked + .box { background: var(--card); }
.radio input:checked + .box::after { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--brand); transform: none; }
.opt input:focus-visible + .box { outline: 2px solid var(--brand-dark); outline-offset: 2px; }

/* personal info form */
.info { padding: 24px 60px 8px; display: flex; flex-direction: column; gap: 32px; }
.field { display: flex; flex-direction: column; gap: 4px; border: 0; min-width: 0; }
.field > legend { margin-bottom: 4px; }
.group > legend { margin-bottom: 8px; }
.field-label { font-size: 14px; font-weight: 500; color: var(--muted); line-height: 24px; }
.field-q { font-size: 15px; font-weight: 500; color: var(--ink); line-height: 24px; }
.birth { display: flex; align-items: center; gap: 16px; max-width: 438px; }
.birth-input {
  flex: 1 1 0;
  min-width: 0;
  height: 40px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--field-line);
  border-radius: 8px;
  background: var(--card);
  font-size: 14px;
}
.birth-input:focus-within { border-color: var(--brand); }
.birth-input input { flex: 1 1 auto; min-width: 0; border: 0; outline: 0; font: inherit; color: var(--txt); background: none; }
.birth-input input::placeholder { color: var(--placeholder); }
.age { font-size: 14px; color: var(--brand-txt); white-space: nowrap; padding: 0 8px; }
.info .choices { gap: 12px 20px; }
.info .opt { font-size: 15px; color: var(--ink); }

.mobile .form { padding: 24px 0; }
.mobile .section-head { padding: 0 20px 0 20px; }
.mobile .section-title { font-size: 17px; }
.mobile .options { padding: 0 20px; gap: 24px; }
.mobile .group-label { font-size: 15px; }
.mobile .choices { gap: 14px 20px; }
.mobile .info { padding: 16px 20px 8px; gap: 24px; }
.mobile .birth { gap: 8px; }
.mobile .age { padding: 0 2px; }

/* ── ACTIONS ── */
.actions { flex: 0 0 auto; position: sticky; bottom: 0; background: var(--card); padding: 16px; display: flex; justify-content: center; gap: 12px; z-index: 3; }
.btn { width: 360px; height: 48px; border-radius: 24px; font-size: 16px; font-weight: 500; }
.btn-ghost { border: 1px solid var(--brand); background: var(--card); color: var(--brand-txt); }
.btn-primary { border: 0; background: var(--brand); color: #ffffff; }
.mobile .btn { width: auto; flex: 1 1 0; }
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-title">E-2 vs G-2</div>
  <div class="toggle" id="tStyle">
    <button type="button" class="chip" data-style="E">E-2 小圓點（地點在 header 右側）</button>
    <button type="button" class="chip" data-style="G">G-2 精簡側邊欄</button>
  </div>
  <div class="toggle" id="tDevice">
    <button type="button" class="chip" data-mobile="0">桌機</button>
    <button type="button" class="chip" data-mobile="1">手機</button>
  </div>
  <div class="toggle" id="tEval">
    <button type="button" class="chip" data-eval="1">有檢查前評估</button>
    <button type="button" class="chip" data-eval="0">無檢查前評估</button>
  </div>
  <button type="button" class="chip" onclick="go(0)">重新開始</button>
  <div class="toolbar-note" id="note"></div>
</div>

<div class="stage" id="stage"></div>

<script>
const STEPS = ['認識您的健康', '規劃專屬方案', '了解檢前準備', '安排檢查當天'];
const PIN = size => `<svg width="${size}" height="${size}" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 14.5s5-4.6 5-8.3A5 5 0 0 0 3 6.2c0 3.7 5 8.3 5 8.3z" stroke="#15967b" stroke-width="1.6"/><circle cx="8" cy="6.3" r="1.7" stroke="#15967b" stroke-width="1.6"/></svg>`;
const CHEVRON_RIGHT = '<svg width="16" height="22" viewBox="0 0 16 22" fill="none" aria-hidden="true"><path d="M6 6l5 5-5 5" stroke="#adadad" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHEVRON_DOWN = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="#474847" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// Real copy for the 認識您的健康 pages (Figma: 03_基本資料-體況, Section 3)
const FORMS = {
  history: {
    eyebrow: '健康背景 (1/4)', title: '是否有以下個人病史？', none: '我沒有以下病史',
    groups: [
      ['慢性三高疾病', ['高血壓', '糖尿病', '高血脂', '癲癇', '中風']],
      ['眼科與耳鼻喉相關疾病', ['白內障', '青光眼', '黃斑部病變', '高度近視 (任一眼超過500度)', '聽力障礙']],
      ['心肺相關疾病', ['心臟病', '氣喘', '慢性氣管炎', '肺氣腫', '肺結核']],
      ['肝膽腸胃相關疾病', ['肝病', 'B、C 型肝炎', '脂肪肝', '逆流性食道炎', '胃潰瘍', '十二指腸潰瘍', '胃炎']],
      ['婦科與乳房相關疾病', ['乳房纖維腺瘤 / 囊腫', '卵巢囊腫', '子宮肌瘤']],
      ['其他相關疾病', ['慢性過敏', '貧血', '甲狀腺疾病']]
    ]
  },
  family: {
    eyebrow: '健康背景 (2/4)', title: '您的家族成員(包含祖父母、父母、兄弟姊妹或子女) 是否有以下疾病？', none: '我沒有以下病史',
    groups: [
      ['癌症家族史', ['乳癌', '肺癌', '胰臟癌', '大腸癌', '胃癌', '卵巢 / 子宮癌', '攝護腺癌', '肝癌', '鼻咽癌', '甲狀腺癌']],
      ['慢性三高、心腦血管相關疾病', ['高血壓、糖尿病、高血脂', '心血管疾病', '腦血管疾病']],
      ['免疫與血液疾病', ['自體免疫疾病（如：紅斑性狼瘡 / 類風濕關節炎）', '貧血', '白血病']],
      ['肝膽腸胃相關疾病', ['慢性肝炎或肝硬化', '腎臟疾病']],
      ['其他相關疾病', ['甲狀腺疾病', '失智症']]
    ]
  },
  symptoms: {
    eyebrow: '健康背景 (3/4)', title: '最近三個月是否有以下不舒服症狀？', none: '我沒有以下病史',
    groups: [
      ['耳鼻喉症狀', ['耳鳴', '聽力減退', '久治不癒的咳嗽']],
      ['胸部症狀', ['心悸', '不定時胸悶']],
      ['上消化道症狀', ['噁心', '胃灼熱', '吞嚥困難']],
      ['下消化道症狀', ['慢性腹瀉', '慢性便祕', '血便（鮮紅色）', '黑便', '排便習慣改變']],
      ['四肢與軀幹肌肉骨骼症狀', ['手腳肌肉無力', '手麻痛', '腳麻痛']],
      ['特殊症狀', ['體重無故減輕 ≥ 3公斤', '多尿 / 頻尿']]
    ]
  },
  lifestyle: {
    eyebrow: '健康背景 (4/4)', title: '哪些比較像您平常的生活？', desc: '依您自己的感覺就好，可參考一週三次以上', none: '皆不符合',
    groups: [
      ['關於我的飲食', ['吃全素 (純植物性)', '愛吃甜食或手搖', '愛吃炸物或高油食物', '愛吃重鹹或醃製物', '很少吃蔬菜水果', '不太喝白開水', '常吃宵夜']],
      ['關於我的作息與運動', ['常熬夜或睡眠不夠', '幾乎沒運動', '長時間久坐']],
      ['我現在或以前有', ['抽菸', '嗜酒', '嚼檳榔']]
    ]
  }
};

// step: index into STEPS; -1 = login interstitial (doesn't occupy a step); -2 = complete
function buildPages(hasEval) {
  return [
    { step: 0, title: '懂您的與眾不同，更懂守護您的健康', sub: '先讓我們填寫基本健康資訊，幫助我們提供合適的檢查資訊', form: 'info' },
    { step: 0, title: '個人病史', sub: '曾經發生過的健康狀況，作為檢查項目參考', form: 'history' },
    { step: 0, title: '家族病史', sub: '提供重要的家族健康背景，協助掌握健康脈絡', form: 'family' },
    { step: 0, title: '個人身體狀況', sub: '了解您的目前狀態，幫助篩選適合您的檢查項目資訊', form: 'symptoms' },
    { step: 0, title: '生活習慣', sub: '依照您平常的作息與飲食，我們會找出適合的檢查項目', form: 'lifestyle' },
    { step: 1, title: '正在為您規劃專屬方案', sub: '約需 5 秒', loading: true },
    { step: 1, title: '選擇健檢方案', sub: '照您的身體狀況，為您排出專屬方案' },
    { step: 1, title: '添加檢查項目', sub: '依您的狀況，還可以考慮這些檢查' },
    { step: 1, title: '確認方案及檢查項目', sub: '確認方案與加選項目' },
    hasEval && { step: 2, title: '檢查前評估', sub: '請勾選您目前有的症狀或情況' },
    { step: 2, title: '檢查提醒', sub: '請詳閱以下檢查注意事項' },
    { step: -1, title: '登入或註冊', sub: '登入或註冊後，接著安排檢查當天', login: true, cta: '登入（模擬）' },
    { step: 3, title: '檢查相關資料', sub: '請填寫有人可簽收的地址，避免退件' },
    { step: 3, title: '選擇預約時間', sub: '請選擇健檢日期與報到時段' },
    { step: 3, title: '檢查預約資料', sub: '確認所有資料後完成預約', cta: '確認預約' },
    { step: -2, title: '預約完成', sub: '我們已收到您的預約，健檢前會再提醒您', complete: true }
  ].filter(Boolean);
}

const state = { idx: 1, style: 'E', mobile: false, hasEval: true, sheet: false, answers: {} };
let pages = buildPages(true);
let timer = null;

function dotsHtml(pos, total, label) {
  let html = '';
  for (let k = 1; k <= total; k++) html += `<div class="dot${k <= pos ? ' on' : ''}"></div>`;
  return `<div class="dots" role="img" aria-label="${label}">${html}</div>`;
}

function optHtml(type, name, value) {
  const a = state.answers[name];
  const checked = type === 'radio' ? a === value : (a || []).includes(value);
  return `<label class="opt${type === 'radio' ? ' radio' : ''}">
    <input type="${type}" name="${name}" value="${value}"${checked ? ' checked' : ''}><span class="box" aria-hidden="true"></span>${value}
  </label>`;
}

function sectionHead(eyebrow, title, desc) {
  return `<div class="section-head">
    ${eyebrow ? `<p class="eyebrow">${eyebrow}</p>` : ''}
    <h2 class="section-title">${title}<span class="req" aria-hidden="true">*</span></h2>
    ${desc ? `<p class="section-desc">${desc}</p>` : ''}
  </div>`;
}

function ageText() {
  const y = parseInt(state.answers.birthY, 10);
  if (!y || y < 1900 || y > new Date().getFullYear()) return '目前 -- 歲';
  return `目前 ${new Date().getFullYear() - y} 歲`;
}

function infoFormHtml() {
  const a = state.answers;
  const radios = (name, opts) => `<div class="choices">${opts.map(o => optHtml('radio', name, o)).join('')}</div>`;
  const birth = (key, ph, unit, label) => `<label class="birth-input"><input inputmode="numeric" name="${key}" value="${a[key] || ''}" placeholder="${ph}" aria-label="${label}">${unit}</label>`;
  return `<div class="form">
    ${sectionHead('', '填寫真實資料', '性別與年齡會影響檢查項目，也會成為您的健檢紀錄，請留下真實資料')}
    <div class="info">
      <fieldset class="field"><legend class="field-label">生理性別</legend>${radios('sex', ['男性', '女性'])}</fieldset>
      <fieldset class="field"><legend class="field-label">生日</legend>
        <div class="birth">${birth('birthY', '西元', '年', '出生年（西元）')}${birth('birthM', '01', '月', '出生月')}${birth('birthD', '01', '日', '出生日')}<span class="age" id="age">${ageText()}</span></div>
      </fieldset>
      <fieldset class="field"><legend class="field-q">您目前是否為以下狀態？</legend>${radios('pregnant', ['懷孕中、疑似或準備懷孕', '產後哺乳中', '以上皆無'])}</fieldset>
      <fieldset class="field"><legend class="field-q">您是否已停經超過一年？</legend>${radios('menopause', ['是', '否'])}</fieldset>
    </div>
  </div>`;
}

function checkFormHtml(key) {
  const f = FORMS[key];
  return `<div class="form">
    ${sectionHead(f.eyebrow, f.title, f.desc)}
    <div class="options">
      <div class="none-row">${optHtml('checkbox', key, f.none)}</div>
      ${f.groups.map(([label, opts]) => `
        <fieldset class="group field"><legend class="group-label">${label}</legend>
          <div class="choices">${opts.map(o => optHtml('checkbox', key, o)).join('')}</div>
        </fieldset>`).join('')}
    </div>
  </div>`;
}

function render() {
  const pg = pages[state.idx];
  const cur = pg.step;
  const isE = state.style === 'E';
  const m = state.mobile;

  // Per-step page progress; the loading screen doesn't count as a page
  const inStep = pages.filter(p => p.step === cur && cur >= 0 && !p.loading);
  const total = inStep.length;
  const pos = pg.loading ? 0 : inStep.indexOf(pg) + 1;
  const showDots = cur >= 0 && total > 1;
  const showCount = showDots && pos > 0;
  const dotsLabel = pos > 0 ? `第 ${pos} 頁，共 ${total} 頁` : `共 ${total} 頁`;
  const showStepper = !pg.complete;
  const mName = pg.login ? '登入後，接著安排檢查當天' : (cur >= 0 ? STEPS[cur] : '');

  const header = `
    <header class="header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div><div class="brand-name">國泰健康管理</div><div class="brand-en">Cathay Healthcare Management</div></div>
      </div>
      <div class="location">${PIN(m ? 12 : 14)}敦南中心</div>
    </header>`;

  const railItems = STEPS.map((name, i) => {
    const current = i === cur;
    return `<li class="rail-item${current ? ' current' : ''}"${current ? ' aria-current="step"' : ''}>
        <span class="label">${name}</span>${current && showCount ? `<span class="rail-count">${pos} / ${total}</span>` : ''}
      </li>${cur === -1 && i === 3 ? '<li class="rail-note">登入後開始</li>' : ''}`;
  }).join('');

  let stepper = '';
  if (showStepper && isE && !m) {
    stepper = `<ol class="e-steps" aria-label="預約進度">${STEPS.map((label, i) => {
      const current = i === cur;
      return `<li class="e-step${current ? ' current' : ''}"${current ? ' aria-current="step"' : ''}>
        <div class="e-step-body"><span class="label">${label}</span>${current && showDots ? dotsHtml(pos, total, dotsLabel) : ''}</div>
        ${i < STEPS.length - 1 ? CHEVRON_RIGHT : ''}
      </li>`;
    }).join('')}</ol>`;
  } else if (showStepper && isE && m) {
    stepper = `<div class="e-mobile"><div class="m-name${pg.login ? ' login' : ''}">${mName}</div>${showDots ? dotsHtml(pos, total, dotsLabel) : ''}</div>`;
  } else if (showStepper && m) {
    stepper = `<div class="g-mobile">
      <button type="button" class="g-toggle" aria-expanded="${state.sheet}" onclick="toggleSheet()">
        <span class="m-name${pg.login ? ' login' : ''}">${mName}</span>
        ${showCount ? `<span class="count">${pos} / ${total}</span>` : ''}${CHEVRON_DOWN}
      </button>
      ${state.sheet ? `<nav class="g-sheet" aria-label="預約進度"><ol class="rail-list">${railItems}</ol></nav>` : ''}
    </div>`;
  }

  let card;
  if (pg.form === 'info') card = `<div class="page-card">${infoFormHtml()}</div>`;
  else if (pg.form) card = `<div class="page-card">${checkFormHtml(pg.form)}</div>`;
  else if (pg.loading) card = '<div class="page-card placeholder"><div class="loading"><div class="spinner" aria-hidden="true"></div><div>正在依您的健康資料排出方案…</div></div></div>';
  else card = `<div class="page-card placeholder">［頁面內容：${pg.title}］</div>`;

  const pageHtml = `
    <main class="page">
      <h1 class="page-title">${pg.title}</h1>
      <p class="page-sub">${pg.sub}</p>
      ${card}
    </main>`;

  const rail = showStepper && !isE && !m;
  const body = `<div class="body-row" id="bodyRow">
      ${rail ? `<nav class="rail" aria-label="預約進度"><ol class="rail-list">${railItems}</ol></nav>` : ''}
      ${pageHtml}
      ${rail ? '<div class="rail-spacer"></div>' : ''}
    </div>`;

  const actions = !pg.loading && !pg.complete
    ? `<div class="actions">
        <button type="button" class="btn btn-ghost" onclick="back()">上一步</button>
        <button type="button" class="btn btn-primary" onclick="next()">${pg.cta || '下一步'}</button>
      </div>`
    : '';

  const stage = document.getElementById('stage');
  stage.className = 'stage' + (m ? ' mobile' : '');
  stage.innerHTML = `<div class="screen">${header}${stepper}${body}${actions}</div>`;

  document.querySelectorAll('#tStyle .chip').forEach(b => b.classList.toggle('on', b.dataset.style === state.style));
  document.querySelectorAll('#tDevice .chip').forEach(b => b.classList.toggle('on', (b.dataset.mobile === '1') === m));
  document.querySelectorAll('#tEval .chip').forEach(b => b.classList.toggle('on', (b.dataset.eval === '1') === state.hasEval));
  document.getElementById('note').textContent = `第 ${state.idx + 1} 個畫面，共 ${pages.length} 個`;
}

function go(i) {
  state.idx = Math.max(0, Math.min(i, pages.length - 1));
  state.sheet = false;
  clearTimeout(timer);
  if (pages[state.idx].loading) timer = setTimeout(() => go(state.idx + 1), 1500);
  render();
  window.scrollTo(0, 0);
  const row = document.getElementById('bodyRow');
  if (row) row.scrollTop = 0;
}

function next() { go(state.idx + 1); }

function back() {
  let t = state.idx - 1;
  if (t >= 0 && pages[t].loading) t--;
  go(t);
}

function toggleSheet() {
  state.sheet = !state.sheet;
  render();
}

// Answers are kept across page changes; the "none" option is exclusive within its question
document.getElementById('stage').addEventListener('change', e => {
  const t = e.target;
  if (t.type === 'radio') { state.answers[t.name] = t.value; return; }
  if (t.type !== 'checkbox') return;
  const f = FORMS[t.name];
  let list = state.answers[t.name] || [];
  if (!t.checked) list = list.filter(v => v !== t.value);
  else if (t.value === f.none) list = [t.value];
  else list = list.filter(v => v !== f.none).concat(t.value);
  state.answers[t.name] = list;
  document.querySelectorAll(`input[name="${t.name}"]`).forEach(i => { i.checked = list.includes(i.value); });
});
document.getElementById('stage').addEventListener('input', e => {
  const t = e.target;
  if (!t.name || !t.name.startsWith('birth')) return;
  state.answers[t.name] = t.value.replace(/\D/g, '');
  t.value = state.answers[t.name];
  const age = document.getElementById('age');
  if (age) age.textContent = ageText();
});

document.getElementById('tStyle').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  state.style = b.dataset.style; state.sheet = false; render();
});
document.getElementById('tDevice').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  state.mobile = b.dataset.mobile === '1'; state.sheet = false; render();
});
document.getElementById('tEval').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  state.hasEval = b.dataset.eval === '1';
  pages = buildPages(state.hasEval);
  go(0);
});

go(1);
</script>
</body>
</html>
